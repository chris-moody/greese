<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="greese logo">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C04A"/>
      <stop offset="1" stop-color="#D9772B"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D22"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>

  <rect width="640" height="220" rx="28" fill="url(#bg)"/>

  <!-- Emblem: gear ring + oil drop -->
  <g transform="translate(112 110)">
    <circle r="62" fill="none" stroke="url(#amber)" stroke-width="16" stroke-dasharray="18.85 18.85"/>
    <circle r="52" fill="#1E2228" stroke="url(#amber)" stroke-width="6"/>
    <path d="M0 -40 C0 -40 -27 -8 -27 10 A27 27 0 0 0 27 10 C27 -8 0 -40 0 -40 Z" fill="url(#amber)"/>
    <ellipse cx="-10" cy="8" rx="5" ry="10" fill="#FFFFFF" opacity="0.35" transform="rotate(20 -10 8)"/>
  </g>

  <!-- Wordmark -->
  <text x="204" y="130" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3" fill="#F2EDE4">greese</text>

  <!-- Dripping underline -->
  <rect x="208" y="150" width="336" height="8" rx="4" fill="url(#amber)"/>
  <rect x="496" y="154" width="8" height="16" fill="url(#amber)"/>
  <circle cx="500" cy="174" r="7" fill="url(#amber)"/>
  <rect x="440" y="154" width="5" height="8" fill="url(#amber)"/>
  <circle cx="442.5" cy="164" r="4" fill="url(#amber)"/>
</svg>
