# Publishes @greese-ui/* to public npm with Changesets.
#
# On every push to main: if unreleased changesets exist, opens or updates a
# "Version Packages" PR. Merging that PR runs this again and publishes.
#
# Secret: NPM_TOKEN, an npm automation token with publish rights to @greese-ui.
# Packages publish publicly with provenance (id-token: write below), which
# links each version to this repository and the run that built it.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          # Writes an .npmrc that authenticates publishes with NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --no-audit --no-fund

      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
