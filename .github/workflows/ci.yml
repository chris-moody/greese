name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint every commit in the PR
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build
      - name: Verify the packages as a consumer installs them
        run: npm run verify:packages
      - run: npm run check-types
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run size

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Lighthouse budgets
        run: npm run lighthouse -w playground

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report
            apps/playground/lighthouse-report
          retention-days: 7
