# GreeseUI on GitHub Pages, at https://chris-moody.github.io/greese/:
#
#   /            the homepage (apps/site)
#   /docs        the docs, a route of the same app, made from apps/docs'
#                stories and MDX at build time (apps/site/src/docs)
#   /studio      Theme Studio, a route of the same app (apps/site): hosted, it
#                compiles in the browser and keeps the theme there
#
# The app is built for /<repository>/ (GREESE_BASE) and routes by path; its
# build writes studio/index.html and 404.html so a direct visit works.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'apps/docs/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the packages first (turbo), then the site, docs included.
      - run: npx turbo run build --filter=site
        env:
          GREESE_BASE: /${{ github.event.repository.name }}/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r apps/site/dist/. _site/
          # Serve files as they are, including _-prefixed ones.
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
