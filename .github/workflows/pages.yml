# GreeseUI on GitHub Pages, at https://chris-moody.github.io/greese/:
#
#   /            the homepage (apps/site)
#   /storybook/  the docs (apps/docs), where the site's "docs" links point
#   /studio/     Theme Studio (apps/theme-studio), hosted: it compiles in the
#                browser and keeps the theme there (src/hosted.ts)
#
# Every app builds with relative asset paths, so none needs the repo name.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'apps/docs/**'
      - 'apps/theme-studio/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the packages first (turbo), then the three apps.
      - run: npx turbo run build --filter=site --filter=docs --filter=theme-studio
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r apps/site/dist/. _site/
          cp -r apps/docs/storybook-static _site/storybook
          cp -r apps/theme-studio/dist _site/studio
          # Serve files as they are, including Storybook's _-prefixed ones.
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
